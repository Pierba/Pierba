name: Generate contribution Pac-Man

on: # List of events that trigger the workflow
  schedule:
    # Daily GitHub runs cron
    - cron: "7 22 * * *"
  workflow_dispatch: # lets you run it on demand from the Actions tab
  push: # Triggers the workflow on push events to this repository main branch
    branches: [main]

permissions: # Temporary read/write GITHUB_TOKEN permissions for the workflow to run
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest # Brand new virtual machine with the latest version of Ubuntu
    steps:
      - uses: actions/checkout@v4 # Clone the repository to the virtual machine

      - uses: actions/setup-python@v5 # Install Python on the virtual machine
        with:
          python-version: "3.12"

      - name: Draw the Pac-Man graph
        env: # Environment variables for the script
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Authenticates the GraphQL call that reads the contribution calendar
          GITHUB_USER: ${{ github.repository_owner }} # Automatically resolve the repository owner username
        run: python scripts/generate_pacman.py # Writes dist/github-pacman.svg and dist/github-pacman-dark.svg

      - name: Publish to the pacman branch
        uses: crazy-max/ghaction-github-pages@v4 # Third-party action that pushes the generated SVGs to the pacman branch
        with:
          target_branch: pacman # Create pacman branch if it doesn't exist, otherwise overwrite it
          build_dir: dist
          keep_history: false # Force-push a single orphan commit, so the branch never holds more than the latest SVGs
        env: # Environment variables for the script
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
