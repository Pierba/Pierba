name: Update profile README

on: # List of events that trigger the workflow
  schedule:
    # Daily GitHub runs cron
    - cron: "7 22 * * *"
  workflow_dispatch: # Lets you run it on demand from the Actions tab
  push: # Triggers the workflow on push events to this repository main branch
    branches: [main]

permissions: # Temporary read/write GITHUB_TOKEN permissions for the workflow to run
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest # Brand new virtual machine with the latest version of Ubuntu
    steps:
      - uses: actions/checkout@v4 # Clone the repository to the virtual machine and leave git credentials configured for the GITHUB_TOKEN

      - uses: actions/setup-python@v5 # Install Python on the virtual machine
        with:
          python-version: "3.12"

      - name: Regenerate the projects table
        env: # Environment variables for the script
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Authenticates API calls
          GITHUB_USER: ${{ github.repository_owner }} # Automatically resolve the repository owner username
        run: python scripts/update_projects.py

      - name: Commit if anything changed
        run: |
          # Bot
          BOT_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git config user.email "$BOT_EMAIL"
          git add README.md
          # Commit only if README changes
          git diff --staged --quiet && exit 0

          # Keep a single, permanently rewritten bot commit instead of one per update.
          # Amending is only safe when the tip is the bot's own commit:
          # any hand-written commit is left alone and a new one is added on top.
          if [ "$(git log -1 --format='%ae')" = "$BOT_EMAIL" ]; then
            # --reset-author refreshes the date, otherwise the repo would show the age of the first bot commit forever.
            git commit --amend --no-edit --reset-author
            # --force-with-lease aborts if the remote moved since checkout, so a manual push landing mid-run fails the job instead of being erased.
            git push --force-with-lease
          else
            git commit -m "chore: refresh profile README"
            git push
          fi